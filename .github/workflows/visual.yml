name: Visual regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshots:
    # Explicit OS family + architecture, never macos-latest or Linux goldens.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install compilers
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          rustup default 1.92.0
          npm install --global elm@0.19.3-0 elm-format@0.8.7
      - run: npm ci
      - run: npm run test:visual:install
      - name: Record rendering environment
        run: |
          sw_vers
          uname -m
          node --version
          npx playwright --version
      - name: Build before the browser startup deadline
        run: npm run test:visual:build
      - name: Compare approved snapshots
        run: npm run test:visual
      - name: Keep visual diffs and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: |
            playwright-report/
            test-results/visual/
          retention-days: 14
          if-no-files-found: ignore
