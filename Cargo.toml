[package]
name = "fightlines-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
default-run = "fightlines-server"

[[bin]]
name = "fightlines-supervisor"
path = "src/supervisor/main.rs"

[workspace]
exclude = ["old"]
resolver = "2"

[dependencies]
argon2 = "0.5"
rpassword = "7"
base64 = "0.22"
dotenvy = "0.15.7"
actix-files = "0.7"
actix-web = "4"
serde = { version = "1", features = ["derive"] }
rand = "0.10"
juniper = "0.17"
serde_json = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["json"] }
libc = "0.2"
